<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1>Gerador de Cartão de Perfil</h1>
        <input type="text" name="nome" id="nome" placeholder="Seu nome">
        <input type="text" name="cargo" id="cargo" placeholder="Sua profissão">
        <button>Gerar cartão</button>
    </div>
    <div class="card" id="cartao">
        <span>Seu nome aqui</span>
        <span>Sua profissão aqui</span>
    </div>
    <p class="contador" id="contador">Cartões gerados:0</p>
    </div>
</body>
</html>
